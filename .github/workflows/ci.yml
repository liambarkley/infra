name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # apply only runs for this trigger - see the apply job below for why

permissions:
  contents: read

env:
  TF_VERSION: "1.17.1" # >= 1.10 required for the S3 backend's use_lockfile

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [envs/dev, bootstrap-state, ci-oidc, landing-zone, log-archive, modules/network, modules/eks, modules/bootstrap, modules/storage, modules/github-oidc-roles, modules/rds]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false
          terraform validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
      - run: tflint --recursive

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          # Skipped deliberately for this single-account, cost-conscious demo project (see
          # docs/PLAN.md's cost control section) - each is a real check that makes sense for a
          # production account, not a gap we didn't notice:
          #   CKV_AWS_119  DynamoDB CMK encryption   - default AWS-owned encryption is already on;
          #                                            a customer-managed KMS key adds ~$1/mo for
          #                                            a lock table with no sensitive data.
          #   CKV_AWS_145  S3 bucket KMS encryption   - same trade-off, for the tfstate bucket.
          #   CKV_AWS_130  public subnets auto-assign - intentional: these subnets exist to be
          #                public (future ALB for the cache node).
          #   CKV2_AWS_62  S3 event notifications     - nothing downstream to notify; demo bucket.
          #   CKV_AWS_18   S3 access logging          - extra bucket + cost for a state bucket
          #                                            only Liam and CI touch.
          #   CKV_AWS_144  S3 cross-region replication - single-region project by design.
          #   CKV2_AWS_11  VPC flow logs              - real gap, deferred to phase 4
          #                                            (observability), not skipped forever.
          #   CKV_AWS_252  CloudTrail SNS topic       - nobody's subscribed; the org trail's
          #                                            data is read via its S3 bucket, not SNS.
          #   CKV_AWS_35   CloudTrail KMS CMK         - same CMK cost trade-off as above, for
          #                                            an audit log nobody's paying to encrypt
          #                                            beyond the default.
          #   CKV2_AWS_10  CloudTrail -> CloudWatch   - real gap, same as VPC flow logs: ongoing
          #                Logs integration             CloudWatch Logs cost, deferred to phase 4.
          #   CKV2_AWS_64  KMS key policy defined    - modules/eks's Secrets-encryption key uses
          #                                            AWS's implicit default policy (full access
          #                                            for the account root) on purpose; writing
          #                                            that same grant out explicitly only trades
          #                                            this finding for three noisier ones
          #                                            (CKV_AWS_111/356/109 below) on an
          #                                            identical policy.
          #   CKV_AWS_111  IAM write access w/o      - modules/eks's Karpenter controller policy:
          #   CKV_AWS_356  constraints / "*" resource  RunInstances/CreateFleet/CreateLaunchTemplate
          #                                            and the Describe* calls it needs don't
          #                                            support resource-level scoping - matches
          #                                            Karpenter's own documented minimal IAM
          #                                            policy (https://karpenter.sh), not a gap.
          #   CKV_AWS_161  RDS IAM auth              - modules/rds: password auth via Secrets
          #                                            Manager (manage_master_user_password)
          #                                            already keeps the password out of this
          #                                            repo entirely; switching to IAM auth is a
          #                                            real enhancement, not done here to avoid
          #                                            redesigning the demo app's connection
          #                                            logic for a disposable database.
          #   CKV_AWS_293  RDS deletion protection   - would block `terraform destroy`, which
          #                                            this disposable demo database needs every
          #                                            session (docs/PLAN.md's cost-control
          #                                            section) - the opposite of what's wanted.
          #   CKV_AWS_353  RDS Performance Insights  - extra cost for a database with no real
          #                                            traffic to profile.
          #   CKV_AWS_129  RDS log exports           - real gap, same as the other CloudWatch
          #                Logs cases above            Logs cases above - deferred to phase 4.
          #   CKV_AWS_133  RDS backup policy         - deliberately disabled
          #                                            (backup_retention_period = 0): this
          #                                            instance is destroyed every session, so
          #                                            there's nothing a backup would ever
          #                                            restore into. Real DR story is Velero
          #                                            (phase 5), for the cluster, not this.
          #   CKV_AWS_118  RDS enhanced monitoring   - extra CloudWatch cost for a database with
          #                                            no real traffic to monitor.
          #   CKV2_AWS_30  RDS Postgres query logging - needs a custom parameter group; real gap,
          #                                            deferred to phase 4 with the others above.
          skip_check: "CKV_AWS_119,CKV_AWS_145,CKV_AWS_130,CKV2_AWS_62,CKV_AWS_18,CKV_AWS_144,CKV2_AWS_11,CKV_AWS_252,CKV_AWS_35,CKV2_AWS_10,CKV2_AWS_64,CKV_AWS_111,CKV_AWS_356,CKV_AWS_161,CKV_AWS_293,CKV_AWS_353,CKV_AWS_129,CKV_AWS_133,CKV_AWS_118,CKV2_AWS_30"

  # Two configure-aws-credentials steps per job: envs/dev's provider (platform-dev) and its
  # backend (shared-services) are different accounts, so one set of assumed credentials can't
  # cover both. This action has no option to write a named profile (aws-profile is not a real
  # input on it, despite how it might look at a glance) - output-credentials: true + explicit
  # step outputs is the real mechanism, passed straight through as -var/-backend-config rather
  # than relying on either step's ambient env vars (which would just overwrite each other).
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [fmt, validate, tflint, checkov]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: platform_dev
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLATFORM_DEV_PLAN_ROLE_ARN }}
          aws-region: ca-central-1
          output-credentials: true
          output-env-credentials: false
      - id: shared_services
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SHARED_SERVICES_PLAN_ROLE_ARN }}
          aws-region: ca-central-1
          output-credentials: true
          output-env-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - working-directory: envs/dev
        run: |
          terraform init \
            -backend-config="bucket=build-cache-tfstate-62512aa5" \
            -backend-config="access_key=${{ steps.shared_services.outputs.aws-access-key-id }}" \
            -backend-config="secret_key=${{ steps.shared_services.outputs.aws-secret-access-key }}" \
            -backend-config="token=${{ steps.shared_services.outputs.aws-session-token }}"
          terraform plan \
            -var="aws_access_key_id=${{ steps.platform_dev.outputs.aws-access-key-id }}" \
            -var="aws_secret_access_key=${{ steps.platform_dev.outputs.aws-secret-access-key }}" \
            -var="aws_session_token=${{ steps.platform_dev.outputs.aws-session-token }}"

  # Deliberately NOT triggered by push-to-main: envs/dev stays unapplied until phase 2 (its
  # NAT gateway costs hourly), and this repo merges to main often enough that an
  # automatic on-push apply would create it the next time anything unrelated merges. Trigger
  # this by hand (Actions tab -> this workflow -> Run workflow, or `gh workflow run ci.yml`)
  # once phase 2 actually starts.
  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [fmt, validate, tflint, checkov]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: platform_dev
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLATFORM_DEV_APPLY_ROLE_ARN }}
          aws-region: ca-central-1
          output-credentials: true
          output-env-credentials: false
      - id: shared_services
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SHARED_SERVICES_APPLY_ROLE_ARN }}
          aws-region: ca-central-1
          output-credentials: true
          output-env-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - working-directory: envs/dev
        run: |
          terraform init \
            -backend-config="bucket=build-cache-tfstate-62512aa5" \
            -backend-config="access_key=${{ steps.shared_services.outputs.aws-access-key-id }}" \
            -backend-config="secret_key=${{ steps.shared_services.outputs.aws-secret-access-key }}" \
            -backend-config="token=${{ steps.shared_services.outputs.aws-session-token }}"
          terraform apply -auto-approve \
            -var="aws_access_key_id=${{ steps.platform_dev.outputs.aws-access-key-id }}" \
            -var="aws_secret_access_key=${{ steps.platform_dev.outputs.aws-secret-access-key }}" \
            -var="aws_session_token=${{ steps.platform_dev.outputs.aws-session-token }}"
